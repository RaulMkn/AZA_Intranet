spring.application.name=aza_intranet_back
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/aza_intranet}
spring.datasource.username=${DB_USERNAME:aza}
spring.datasource.password=${DB_PASSWORD:aza}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=1800000

spring.jpa.open-in-view=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.security.user.name=${APP_USER:aza}
spring.security.user.password=${APP_PASSWORD:aza}

app.cors.origin=${APP_CORS_ORIGIN:http://localhost}
RESEND_API_KEY=${RESEND_API_KEY:}